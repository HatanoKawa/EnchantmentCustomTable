plugins {
    id 'fabric-loom' version '1.13.4'
    id 'maven-publish'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-fabric"
}

repositories {
    mavenCentral()
    maven {
        url = 'https://maven.fabricmc.net/'
        metadataSources {
            mavenPom()
            artifact()
            ignoreGradleMetadataRedirection()
        }
    }
    maven { url = 'https://libraries.minecraft.net/' }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of((findProperty('java_version') ?: '21') as Integer)
}

def fabricMinecraftVersionValue = findProperty('fabric_minecraft_version') ?: '1.21.1'
def fabricVersionedSource = [
        '1.21.1' : 'legacy',
        '1.21.2' : 'legacy_render',
        '1.21.3' : 'legacy_render',
        '1.21.4' : 'legacy_render',
        '1.21.5' : 'legacy_optional_tag',
        '1.21.6' : 'modern_legacy_input',
        '1.21.7' : 'modern_legacy_input',
        '1.21.8' : 'modern_legacy_input',
        '1.21.9' : 'modern',
        '1.21.10': 'modern',
        '1.21.11': 'identifier'
][fabricMinecraftVersionValue] ?: 'identifier'

sourceSets {
    main {
        java.setSrcDirs([
                rootProject.file('fabric/src/main/java'),
                rootProject.file("fabric/src/versioned/${fabricVersionedSource}/java"),
                rootProject.file('src/common/java'),
                rootProject.file('src/common-minecraft/java')
        ])
        resources.setSrcDirs([
                rootProject.file('fabric/src/main/resources'),
                rootProject.file('src/main/resources')
        ])
        resources.exclude 'META-INF/**'
    }
    test {
        java.setSrcDirs([
                rootProject.file('src/test/java')
        ])
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${fabric_minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    testImplementation platform('org.junit:junit-bom:5.10.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def fabricResourceProperties = [
        version                 : version,
        mod_id                  : mod_id,
        mod_name                : mod_name,
        mod_description         : mod_description,
        mod_authors             : mod_authors,
        mod_license             : mod_license,
        fabric_minecraft_version: fabric_minecraft_version,
        fabric_loader_version   : fabric_loader_version
]

processResources {
    inputs.properties fabricResourceProperties
    filesMatching('fabric.mod.json') {
        expand(fabricResourceProperties)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}
