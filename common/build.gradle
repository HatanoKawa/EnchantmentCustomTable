plugins {
    id 'java-library'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

repositories {
    mavenCentral()
}

sourceSets {
    main {
        java.setSrcDirs([
                rootProject.file('src/common/java')
        ])
    }
    test {
        java.setSrcDirs([
                rootProject.file('src/test/java'),
                rootProject.file('src/test-config/java')
        ])
    }
}

dependencies {
    api 'com.google.code.gson:gson:2.11.0'

    testImplementation platform('org.junit:junit-bom:5.10.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation "com.electronwill.night-config:toml:${findProperty('paymentTomlTestVersion') ?: '3.9.0'}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Exercise the production TOML adapter without loading Minecraft or a loader.
tasks.named('compileTestJava') {
    source rootProject.file('src/main/java/com/river_quinn/enchantment_custom_table/config/TomlPaymentConfig.java')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}
