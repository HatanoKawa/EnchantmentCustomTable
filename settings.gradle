pluginManagement {
    repositories {
        mavenLocal()
        maven {
            url = 'https://maven.fabricmc.net/'
            metadataSources {
                mavenPom()
                artifact()
                ignoreGradleMetadataRedirection()
            }
        }
        maven { url = 'https://maven.minecraftforge.net/' }
        gradlePluginPortal()
        mavenCentral()
    }
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == 'fabric-loom'
                    || requested.id.id == 'net.fabricmc.fabric-loom'
                    || requested.id.id == 'net.fabricmc.fabric-loom-remap') {
                useModule("net.fabricmc:fabric-loom:${requested.version}")
            }
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'EnchantmentCustomTable'

include 'common'
include 'forge'
include 'fabric'
