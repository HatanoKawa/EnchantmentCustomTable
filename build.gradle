plugins {
    id 'base'
}

group = mod_group_id
version = mod_version

allprojects {
    group = rootProject.mod_group_id
    version = rootProject.mod_version

    repositories {
        mavenCentral()
        mavenLocal()
        maven {
            url = 'https://maven.minecraftforge.net/'
            content {
                includeGroupByRegex 'net\\.minecraftforge(\\..*)?'
                includeGroup 'de.oceanlabs.mcp'
                includeGroup 'cpw.mods'
            }
        }
        maven {
            url = 'https://maven.fabricmc.net/'
            content {
                includeGroupByRegex 'net\\.fabricmc(\\..*)?'
            }
            metadataSources {
                mavenPom()
                artifact()
                ignoreGradleMetadataRedirection()
            }
        }
        maven { url = 'https://libraries.minecraft.net/' }
    }
}

def releaseModId = providers.gradleProperty('mod_id').get()
def releaseModVersion = providers.gradleProperty('mod_version').get()
def releaseMinecraftVersion = providers.gradleProperty('minecraft_version').get()
def releaseArtifactsDir = layout.buildDirectory.dir('release-artifacts')

tasks.register('verifyCommon') {
    group = 'verification'
    description = 'Runs fast shared JVM tests.'
    dependsOn ':common:test'
}

tasks.register('verifyForge') {
    group = 'verification'
    description = "Builds the Forge ${releaseMinecraftVersion} project."
    dependsOn ':forge:build'
}

tasks.register('verifyFabric') {
    group = 'verification'
    description = "Builds the Fabric ${releaseMinecraftVersion} project."
    dependsOn ':fabric:build'
}

tasks.register('verifyRepresentative') {
    group = 'verification'
    description = 'Runs common tests plus both platform builds.'
    dependsOn ':verifyCommon', ':verifyForge', ':verifyFabric'
}

tasks.register('verifyAll') {
    group = 'verification'
    description = "Runs all available verification for the ${releaseMinecraftVersion} branch."
    dependsOn ':verifyRepresentative'
}

tasks.register('verifyCi') {
    group = 'verification'
    description = 'Runs the verification set expected by GitHub Actions.'
    dependsOn ':verifyAll'
}

tasks.register('cleanReleaseArtifacts', Delete) {
    group = 'build'
    description = 'Deletes collected release artifacts.'
    delete releaseArtifactsDir
}

tasks.register('buildReleaseArtifacts', Copy) {
    group = 'build'
    description = "Builds Forge/Fabric ${releaseMinecraftVersion} release jars and collects them in one directory."
    dependsOn ':cleanReleaseArtifacts'
    dependsOn ':common:build', ':forge:build', ':fabric:build'
    duplicatesStrategy = DuplicatesStrategy.FAIL
    into releaseArtifactsDir

    def expectedJarNames = [
            "${releaseModId}-${releaseModVersion}-forge-mc${releaseMinecraftVersion}.jar",
            "${releaseModId}-${releaseModVersion}-fabric-mc${releaseMinecraftVersion}.jar"
    ]

    from(project(':forge').layout.buildDirectory.dir('libs')) {
        include expectedJarNames[0]
    }
    from(project(':fabric').layout.buildDirectory.dir('libs')) {
        include expectedJarNames[1]
    }

    doLast {
        def outputDir = releaseArtifactsDir.get().asFile
        def actualJarNames = outputDir.exists()
                ? outputDir.listFiles().findAll { it.name.endsWith('.jar') }.collect { it.name }.sort()
                : []
        def expectedSortedJarNames = expectedJarNames.sort()
        def missingJarNames = expectedSortedJarNames - actualJarNames
        def unexpectedJarNames = actualJarNames - expectedSortedJarNames

        if (!missingJarNames.empty || !unexpectedJarNames.empty) {
            throw new GradleException("Release artifact collection mismatch. Missing: ${missingJarNames}; unexpected: ${unexpectedJarNames}")
        }
    }
}
