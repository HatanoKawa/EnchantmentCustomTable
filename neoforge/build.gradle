plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

version = mod_version
group = mod_group_id

repositories {
    mavenCentral()
    mavenLocal()
}

base {
    archivesName = mod_id
}

tasks.named('jar', Jar).configure {
    archiveVersion = "${project.mod_version}-neoforge-mc${project.minecraft_version}"
}

def targetJavaVersion = (findProperty('java_version')
        ?: (minecraft_version.toString().startsWith('26.') ? '25' : '21')) as Integer
java.toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
def recipeResourceDir = rootProject.file(minecraft_version.toString() == '1.21.1'
        ? 'src/versioned/resources/recipe_1_21_1'
        : 'src/versioned/resources/recipe_1_21_2_plus')

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets {
    main {
        java.setSrcDirs([
                rootProject.file('src/main/java'),
                rootProject.file('src/common/java'),
                rootProject.file('src/common-minecraft/java')
        ])
        resources.setSrcDirs([
                rootProject.file('src/main/resources'),
                recipeResourceDir,
                rootProject.file('src/generated/resources')
        ])
    }
    test {
        java.setSrcDirs([
                rootProject.file('src/test/java')
        ])
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'com.google.code.gson:gson:2.11.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from rootProject.file('src/main/templates')
    into layout.buildDirectory.dir("generated/sources/modMetadata")
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
