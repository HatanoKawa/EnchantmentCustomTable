import groovy.json.JsonOutput

// Opt-in only: no change to normal runClient or release builds.
gradle.projectsEvaluated {
    def target = gradle.rootProject.findProject(':1.21.1')
    def client = target.tasks.named('runClient').get()
    target.tasks.register('exportGuiClientLaunch') {
        group = 'verification'
        description = 'Exports the prepared NeoForge 1.21.1 development client launch.'
        dependsOn client.taskDependencies.getDependencies(client)
        doLast {
            // ModDev normally resolves this extra classpath inside RunGameTask.exec().
            client.classpath(client.classpathProvider)
            def javaLauncher = client.javaLauncher.get()
            def command = [javaLauncher.executablePath.asFile.absolutePath]
            // allJvmArgs already includes the ModDev JVM argument providers (modFolders).
            command.addAll(client.allJvmArgs)
            command.addAll(['-cp', client.classpath.asPath, client.mainClass.get()])
            command.addAll(client.args)
            client.argumentProviders.each { command.addAll(it.asArguments()) }
            def output = target.layout.buildDirectory.file('gui-validation/launch.json').get().asFile
            output.parentFile.mkdirs()
            output.text = JsonOutput.prettyPrint(JsonOutput.toJson([
                    command: command,
                    javaHome: javaLauncher.metadata.installationPath.asFile.absolutePath,
                    workingDirectory: client.gameDirectory.get().asFile.absolutePath,
                    // Export only ModDev's explicit overrides, never the inherited shell environment.
                    environment: client.environmentProperty.get()
            ])) + '\n'
            logger.lifecycle('GUI client launch: {}', output)
        }
    }
}
