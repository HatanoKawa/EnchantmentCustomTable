name: Build

on: [push, pull_request]

env:
  GRADLE_ARGS: --no-daemon --no-configuration-cache --max-workers=1 -Dorg.gradle.jvmargs=-Xmx4g

jobs:
  common:
    name: Common
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDKs
        uses: actions/setup-java@v4
        with:
          java-version: |
            21
            25
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify common logic
        run: ./gradlew $GRADLE_ARGS :verifyCommon

  neoforge:
    name: NeoForge ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "26.1"
            project: "26.1"
          - version: "26.1.1"
            project: "26.1.1"
          - version: "26.1.2"
            project: "26.1.2"
          - version: "26.2"
            project: "26.2"
          - version: "26.3"
            project: "26.3"
          - version: "latest"
            project: "neoforge"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDKs
        uses: actions/setup-java@v4
        with:
          java-version: |
            21
            25
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build NeoForge ${{ matrix.version }}
        run: ./gradlew $GRADLE_ARGS :${{ matrix.project }}:build

  fabric:
    name: Fabric ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "26.1"
            project: "fabric_26_1"
          - version: "26.1.1"
            project: "fabric_26_1_1"
          - version: "26.1.2"
            project: "fabric_26_1_2"
          - version: "26.2"
            project: "fabric_26_2"
          - version: "26.3"
            project: "fabric_26_3"
          - version: "default"
            project: "fabric"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDKs
        uses: actions/setup-java@v4
        with:
          java-version: |
            21
            25
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Fabric ${{ matrix.version }}
        run: ./gradlew $GRADLE_ARGS :${{ matrix.project }}:build
